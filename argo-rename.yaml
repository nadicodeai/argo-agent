# argo-rename.yaml — declarative rename + exception config for argo-sync.
#
# Mappings are applied longest-from-first so that longer tokens shadow
# shorter overlapping ones (e.g. "hermes_agent" is handled before "hermes").
# The engine also re-sorts on load, so the order here is for human review.

mappings:
  # --- Composite identifiers (longest first) ---
  - {from: "hermes_tools_mcp_server", to: "argo_tools_mcp_server"}
  - {from: "HermesAgent",             to: "ArgoAgent"}
  - {from: "Hermes-Agent",            to: "Argo-Agent"}
  - {from: "hermes-agent",            to: "argo-agent"}
  - {from: "hermes_agent",            to: "argo_agent"}
  - {from: "hermes_bootstrap",        to: "argo_bootstrap"}
  - {from: "hermes_constants",        to: "argo_constants"}
  - {from: "hermes_logging",          to: "argo_logging"}
  - {from: "hermes_state",            to: "argo_state"}
  - {from: "hermes_time",             to: "argo_time"}
  - {from: "hermes_cli",              to: "argo_cli"}
  - {from: "HERMES_HOME",             to: "ARGO_HOME"}
  - {from: "HERMES_",                 to: "ARGO_"}
  - {from: "~/.hermes",              to: "~/.argo"}
  - {from: ".hermes/",               to: ".argo/"}
  # --- Bare case variants (shortest, last) ---
  - {from: "Hermes",                  to: "Argo"}
  - {from: "HERMES",                  to: "ARGO"}
  - {from: "hermes",                  to: "argo"}

exceptions:
  - path: ".shepherd/**"
    why: "Orchestrator state — by definition documents upstream provenance during the build."
  - path: "argo-rename.yaml"
    why: "This file is the rename config itself — naming both sides of the mapping is necessary."
  - path: "bin/argo-bootstrap.py"
    why: "Bootstrap script references upstream relationship (upstream branch names, provenance comments) that must survive the rename pass."

skip_contexts:
  # Protect URLs that do NOT point to our own project repos/domains.
  # This lets us rename hermes-agent → argo-agent inside OUR project URLs
  # (github.com/NousResearch/hermes-agent, hermes-agent.nousresearch.com,
  # pypi.org/p/hermes-agent) while leaving third-party URLs intact.
  - 'https?://(?!(?:(?:raw\.)?github(?:usercontent)?\.com/NousResearch/hermes(?:-agent|-example-plugins)|hermes-agent\.nousresearch\.com|hermes-agent\.local|pypi\.org/p/hermes-agent|img\.shields\.io/badge/Docs-hermes))[^\s]*'
  - '\b[0-9a-f]{40}\b'      # Don't rewrite inside git-sha-like 40-hex tokens.
  - '\b[0-9a-f]{64}\b'      # Don't rewrite inside sha256-like 64-hex tokens.
