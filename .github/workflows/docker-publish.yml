name: Docker Build and Publish

on:
  push:
    branches: [argo]
  pull_request:
    branches: [argo]
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ghcr.io/nadicodeai/argo-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image starts
        run: |
          docker run --rm \
            -v /tmp/hermes-test:/opt/data \
            --entrypoint /opt/hermes/docker/entrypoint.sh \
            ghcr.io/nadicodeai/argo-agent:test --help

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/argo' || github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (argo branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/argo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nadicodeai/argo-agent:latest
            ghcr.io/nadicodeai/argo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nadicodeai/argo-agent:latest
            ghcr.io/nadicodeai/argo-agent:${{ github.event.release.tag_name }}
            ghcr.io/nadicodeai/argo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
