name: Docker Build and Publish

on:
  push:
    branches: [argo]
  pull_request:
    branches: [argo]
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        # GHA runners have ~14GB free by default. Upstream's image is ~2.5GB
        # (uv venv + playwright chrome + node deps), and `load: true` for the
        # smoke test below exports it to the local docker daemon, which needs
        # ~2x the image size. Without this step, the export fails with "no
        # space left on device" late in the build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Build amd64 only for smoke test (load: true cannot export multi-arch).
      - name: Build image (amd64, smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ghcr.io/nadicodeai/argo-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image starts
        run: |
          docker run --rm \
            -v /tmp/hermes-test:/opt/data \
            --entrypoint /opt/hermes/docker/entrypoint.sh \
            ghcr.io/nadicodeai/argo-agent:test --help

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/argo' || github.event_name == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image (argo branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/argo'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nadicodeai/argo-agent:latest
            ghcr.io/nadicodeai/argo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push multi-arch image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nadicodeai/argo-agent:latest
            ghcr.io/nadicodeai/argo-agent:${{ github.event.release.tag_name }}
            ghcr.io/nadicodeai/argo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
