[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-agent"
version = "0.0.1"
description = "argo — a deployable AI agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "argo" }]
license = { text = "MIT" }
dependencies = [
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-timeout==2.4.0",
  "ruff==0.15.10",
  "ty==0.0.21",
]

[project.scripts]
argo = "argo_cli.main:main"

[tool.setuptools.packages.find]
include = ["argo_cli", "argo_cli.*", "argo_sync", "argo_sync.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, etc.)",
]
addopts = "-m 'not integration' --timeout=30 --timeout-method=signal"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLW1514"]
