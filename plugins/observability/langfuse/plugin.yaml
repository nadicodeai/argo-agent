name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Argo — traces conversations, LLM calls, and tool usage. Opt-in via `argo plugins enable observability/langfuse` (or check the box in `argo plugins`)."
author: NousResearch
requires_env:
  - ARGO_LANGFUSE_PUBLIC_KEY
  - ARGO_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
